<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Background -->
  <rect width="1200" height="630" fill="#0f172a"/>

  <!-- Subtle grid overlay -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Accent bar -->
  <rect x="80" y="210" width="6" height="110" rx="3" fill="#6366f1"/>

  <!-- Main title -->
  <text
    x="112"
    y="285"
    font-family="system-ui, -apple-system, sans-serif"
    font-size="80"
    font-weight="700"
    fill="#ffffff"
    letter-spacing="-1"
  >Calculate Tokens</text>

  <!-- Subtitle -->
  <text
    x="112"
    y="350"
    font-family="system-ui, -apple-system, sans-serif"
    font-size="32"
    font-weight="400"
    fill="#94a3b8"
  >LLM Token Calculator &amp; Cost Estimator</text>

  <!-- Domain -->
  <text
    x="112"
    y="545"
    font-family="system-ui, -apple-system, sans-serif"
    font-size="24"
    font-weight="500"
    fill="#475569"
  >calculatetokens.com</text>
</svg>
