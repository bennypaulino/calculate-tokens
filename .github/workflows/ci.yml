name: CI
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      NEXT_PUBLIC_CSP_MODE: analytics
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Unit tests
        run: npm test
      - name: Type check
        run: npx tsc --noEmit
      - name: Validate prices.json schema
        run: |
          node -e "
            const Ajv = require('ajv');
            const addFormats = require('ajv-formats');
            const schema = require('./public/api/v1/prices.schema.json');
            const data = require('./public/api/v1/prices.json');
            const ajv = new Ajv({ strict: false });
            addFormats(ajv);
            const validate = ajv.compile(schema);
            if (!validate(data)) {
              console.error('Schema validation failed:', JSON.stringify(validate.errors, null, 2));
              process.exit(1);
            }
            console.log('prices.json schema validation passed');
          "
      - name: Dependency audit
        run: npm audit --audit-level=high
      - name: Check audit exemption expiry
        run: node scripts/check-exemption-expiry.js
      - name: Validate security.txt
        run: node scripts/check-security-txt.js
      - name: Check canonical URL consistency
        run: node scripts/check-canonical-urls.js
      - name: Validate CSP configuration
        run: |
          node scripts/generate-headers.js
          node scripts/validate-csp.js
      - name: Validate CSP configuration (adsense mode)
        run: |
          NEXT_PUBLIC_CSP_MODE=adsense node scripts/generate-headers.js
          NEXT_PUBLIC_CSP_MODE=adsense node scripts/validate-csp.js
        env:
          NEXT_PUBLIC_WORKERS_ORIGIN: https://workers.calculatetokens.com
      - name: Build
        run: npm run build
      - name: Compute prices hash
        run: node scripts/compute-prices-hash.js
      - name: Verify build integrity
        run: node scripts/verify-build-integrity.js
      - name: Install Playwright (chromium only)
        run: npx playwright install --with-deps chromium
      - name: Start static server
        run: |
          npx serve out/ -p 3000 &
          npx wait-on http://localhost:3000 --timeout 30000
      - name: Smoke tests (visual regression)
        run: npx playwright test tests/e2e/visual-smoke.spec.ts --project=chromium
      - name: Lighthouse CI
        # Must be the SCOPED, VERSION-PINNED name. `npx lhci` resolved the
        # unscoped registry package `lhci` -- an unrelated placeholder that
        # prints a greeting and exits 0 -- so this gate silently never ran.
        #
        # Deliberately not a devDependency: @lhci/cli pulls ~313 packages whose
        # transitive tree currently trips `npm audit --audit-level=high` (tmp,
        # brace-expansion). Clearing that would need project-wide `overrides`
        # for a tool that only ever runs in CI, so it is pinned here instead.
        run: npx --yes @lhci/cli@0.15.1 autorun
