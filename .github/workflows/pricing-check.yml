name: Daily Pricing Check
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      # check-page-changes.js emits the step output as `changed_providers`.
      # Reading `price_changes` here silently yielded "" on every run, so the
      # notify-price-changes job was permanently skipped and no verification
      # issue was ever opened.
      price_changes: ${{ steps.detection.outputs.changed_providers }}
      stale_models: ${{ steps.staleness.outputs.stale_models }}
      detected_sha: ${{ steps.detection.outputs.detected_sha }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Dependency audit
        run: npm audit --audit-level=high
      - name: Validate prices.json schema
        run: |
          node -e "
            const Ajv = require('ajv');
            const addFormats = require('ajv-formats');
            const schema = require('./public/api/v1/prices.schema.json');
            const data = require('./public/api/v1/prices.json');
            const ajv = new Ajv({ strict: false });
            addFormats(ajv);
            const validate = ajv.compile(schema);
            if (!validate(data)) { console.error(validate.errors); process.exit(1); }
            console.log('Valid');
          "
      - name: Check for stale pricing data
        # Deliberately flagless, so it cannot fail `validate` and block
        # update-timestamps / notify-price-changes via `needs:`. The escalation
        # job below is what actually has teeth.
        id: staleness
        run: node scripts/check-staleness.js
      - name: Detect provider pricing page changes
        id: detection
        run: |
          node scripts/check-page-changes.js
          echo "detected_sha=${GITHUB_SHA}" >> $GITHUB_OUTPUT
      - name: Check audit exemption expiry
        run: node scripts/check-exemption-expiry.js
      - name: Validate security.txt expiry
        run: node scripts/check-security-txt.js
      - name: Validate worker subdomain headers (non-blocking)
        run: node scripts/validate-worker-origin.js
        continue-on-error: true

  update-timestamps:
    runs-on: ubuntu-latest
    needs: [validate]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Update last_checked timestamps
        run: node scripts/update-checked.js
      - name: Update pricing-snapshots hashes
        run: node scripts/check-page-changes.js --update-only
      - name: Compute prices.json hash
        run: node scripts/compute-prices-hash.js
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Do NOT add public/_headers here: it is gitignored (.gitignore:58) and
          # regenerated at deploy time by the Cloudflare build command
          # (`npm run build && node scripts/compute-prices-hash.js`). Adding an
          # ignored path makes `git add` exit 1, and under `bash -e` that killed
          # the whole && chain -- so the commit and push never ran and
          # last_checked/snapshots never persisted.
          git diff --quiet || (
            git add public/api/v1/prices.json scripts/pricing-snapshots/ &&
            git commit -m "chore: update pricing last_checked timestamps and page snapshots [skip ci]" &&
            git push
          )

  notify-price-changes:
    runs-on: ubuntu-latest
    needs: [validate]
    if: ${{ needs.validate.result == 'success' && needs.validate.outputs.price_changes != '' }}
    permissions:
      issues: write
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          ref: ${{ needs.validate.outputs.detected_sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Check for existing open verification issue
        id: dedup_check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          OPEN=$(gh issue list --label "pricing-verification-pending" --state open --json number --jq length)
          echo "open_count=${OPEN}" >> $GITHUB_OUTPUT
      - name: Generate issue body
        id: gen_body
        if: steps.dedup_check.outputs.open_count == '0'
        env:
          PRICE_CHANGES: ${{ needs.validate.outputs.price_changes }}
        run: node scripts/generate-issue-body.js > /tmp/issue_body.md
      - name: Open pricing verification issue
        if: steps.dedup_check.outputs.open_count == '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRICE_CHANGES: ${{ needs.validate.outputs.price_changes }}
        run: |
          gh issue create \
            --title "Pricing verification needed: ${PRICE_CHANGES}" \
            --label "pricing-verification-pending" \
            --body-file /tmp/issue_body.md

  escalate-staleness:
    runs-on: ubuntu-latest
    needs: [validate]
    # Only `needs: [validate]`, so a red run here cannot block update-timestamps
    # or notify-price-changes -- they depend on validate alone.
    if: ${{ needs.validate.result == 'success' && needs.validate.outputs.stale_models != '' }}
    permissions:
      issues: write
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Render issue body
        run: node scripts/generate-staleness-issue-body.js > /tmp/staleness.md
      - name: Open or update the escalation issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LABEL="pricing-staleness-escalation"
          gh label create "$LABEL" --color "B60205" \
            --description "Model pricing unverified past the escalation threshold" 2>/dev/null || true
          EXISTING=$(gh issue list --label "$LABEL" --state open --json number --jq '.[0].number // empty')
          NEW_STATE=$(grep -o '<!-- staleness-state: .* -->' /tmp/staleness.md || echo '')
          if [ -z "$EXISTING" ]; then
            gh issue create --title "Pricing verification overdue" \
              --label "$LABEL" --body-file /tmp/staleness.md
          else
            OLD_STATE=$(gh issue view "$EXISTING" --json body --jq .body \
              | grep -o '<!-- staleness-state: .* -->' || echo '')
            gh issue edit "$EXISTING" --body-file /tmp/staleness.md
            # Comment only when the set actually changed, so the issue does not
            # accrue a daily pile of identical notes.
            if [ "$NEW_STATE" != "$OLD_STATE" ]; then
              gh issue comment "$EXISTING" \
                --body "Staleness set changed. Body updated with the current list."
            fi
          fi
      - name: Fail if anything is critically stale
        # Runs last so the issue is always filed before the run goes red.
        run: node scripts/check-staleness.js --fail-on-critical
